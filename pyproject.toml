[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-os"
version = "0.1.0"
description = "Local-first multi-repo graph memory kernel, secret shield, swarm orchestrator and 3D telemetry for AI coding agents (Claude Code, Cursor, Windsurf, Aider)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AetherOS contributors" }]
keywords = ["mcp", "claude-code", "cursor", "ai-agents", "code-graph", "context-compression", "security", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "fastmcp>=2.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.60",
    "watchdog>=4.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anthropic>=0.60"]

[project.scripts]
aether = "aether_core.cli:app"

[project.urls]
Homepage = "https://github.com/aether-os/aether-os"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aether_core*", "aether_swarm*", "aether_tui*", "aether_web*", "plugins*"]

[tool.setuptools.package-data]
aether_web = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
